[package]
name = "task-api"
authors = ["Thorsten Hans <thorsten.hans@gmail.com>"]
description = ""
version = "0.1.0"
rust-version = "1.93"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
wiremock = "0.6.5"

[features]
default = []
mock = []

[dependencies]
anyhow = "1"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = [
  "json",
  "macros",
] }
axum-anyhow = "0.11.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spin-sdk = { version = "7.0.0", features = ["json"] }
tokio = { version = "1.53.1", features = ["rt", "macros"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[workspace]
