apiVersion: batch/v1
kind: CronJob
metadata:
  name: task-engine-worker
  namespace: task-engine
spec:
  schedule: "*/3 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:latest
              args:
                - "-fsS"
                - "http://task-engine/jobs/cleanup?token=$(WORKER_TOKEN)"
              env:
                - name: WORKER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: task-engine-secrets
                      key: worker-token
